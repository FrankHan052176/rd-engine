name: Official Flutter clients

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.95.0'
  FLUTTER_VERSION: '3.24.5'
  DART_VERSION: '3.5.4'
  OFFICIAL_CLIENT_COMMIT: '092a961b629d318fe290eeafac0cd214a1e9deeb'
  CARGO_TERM_COLOR: always

jobs:
  source-gate:
    name: Locked native/client inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify tracked native provenance
        run: bash scripts/verify-native-provenance.sh --verify --require-tracked
      - name: Checkout the pinned official consumer (no upstream core build)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.OFFICIAL_CLIENT_COMMIT }}
          path: .build-deps/official-client
          persist-credentials: false
      - name: Check all platform snapshots and patch replay
        run: python scripts/test-flutter-ci.py --official-client-tree .build-deps/official-client

  client:
    name: ${{ matrix.id }} application
    needs: source-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static-md
          - id: linux-x64
            platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            triplet: x64-linux
          - id: macos-x64
            platform: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            triplet: x64-osx
          - id: macos-arm64
            platform: macos
            runner: macos-14
            target: aarch64-apple-darwin
            triplet: arm64-osx
          - id: android-arm64
            platform: android
            runner: ubuntu-24.04
            target: aarch64-linux-android
            triplet: arm64-android
          - id: android-armv7
            platform: android
            runner: ubuntu-24.04
            target: armv7-linux-androideabi
            triplet: arm-neon-android
          - id: android-x64
            platform: android
            runner: ubuntu-24.04
            target: x86_64-linux-android
            triplet: x64-android
          - id: ios-arm64
            platform: ios
            runner: macos-14
            target: aarch64-apple-ios
            triplet: arm64-ios
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve raw pinned blob line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.OFFICIAL_CLIENT_COMMIT }}
          path: .build-deps/official-client
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage the reviewed Windows runner override
        if: matrix.platform == 'windows'
        run: cp scripts/client-windows-CMakeLists.txt .build-deps/official-client/flutter/windows/CMakeLists.txt
      - name: Prepare an immutable, patched consumer snapshot
        run: >-
          python scripts/prepare-flutter-ci.py
          --official-client-tree .build-deps/official-client
          --output .build-deps/client/flutter
          --platform ${{ matrix.platform }}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check the locked SDK pair
        run: |
          flutter --version
          dart --version 2>&1 | grep -F "Dart SDK version: $DART_VERSION "
          flutter --version | grep -F "Flutter $FLUTTER_VERSION "
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config nasm yasm autoconf automake libtool \
            libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libxtst-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev libssl-dev libsecret-1-dev libdbus-1-dev
      - name: Install Apple native build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config
          # Upstream's pinned libvpx needs NASM 2.x, not Homebrew's NASM 3.x.
          curl -fL https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o "$RUNNER_TEMP/nasm.zip"
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP/nasm"
          echo "$RUNNER_TEMP/nasm/nasm-2.16.03" >> "$GITHUB_PATH"
      - name: Select the VS 2022 native environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS 2022 C++ tools are required.' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Install the locked Android SDK/NDK and select JDK 17
        if: matrix.platform == 'android'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build rd-engine FRB and the actual application bundle
        run: >-
          python scripts/build-flutter-ci.py
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --triplet ${{ matrix.triplet }}
          --client .build-deps/client/flutter
      - name: Upload the compiled application and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rd-engine-flutter-${{ matrix.id }}-${{ github.sha }}
          path: .build-deps/client/artifacts/*
          if-no-files-found: error
          retention-days: 14
