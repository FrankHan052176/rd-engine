name: Resolve dependency locks

on:
  push:
    branches: [ci/audio-clipboard-locks]
  workflow_dispatch:
    inputs:
      client_lock:
        description: Resolve the pruned official Flutter consumer and check Dart errors
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  locks:
    if: ${{ !inputs.client_lock }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.95.0'
      - name: Resolve each independent workspace without compiling
        run: |
          set -euo pipefail
          # Preserve unrelated locked dependencies; add the new manifest graph.
          for manifest in Cargo.toml native/frb/Cargo.toml native/ohos_napi/Cargo.toml; do
            cargo update --workspace --manifest-path "$manifest"
            cargo metadata --locked --no-deps --format-version=1 --manifest-path "$manifest" > /dev/null
          done
      - name: Bind the lock artifacts to their source manifests
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = ['Cargo.toml', 'native/frb/Cargo.toml', 'native/ohos_napi/Cargo.toml',
                   'Cargo.lock', 'native/frb/Cargo.lock', 'native/ohos_napi/Cargo.lock']
          receipt = {'engine_sha': os.environ['GITHUB_SHA'],
                     'sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          Path('native-locks-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-locks-${{ github.sha }}
          path: |
            Cargo.lock
            native/frb/Cargo.lock
            native/ohos_napi/Cargo.lock
            native-locks-source.json
          if-no-files-found: error
          retention-days: 7

  client-lock:
    if: ${{ inputs.client_lock }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: 092a961b629d318fe290eeafac0cd214a1e9deeb
          path: .build-deps/official-client
          persist-credentials: false
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: false
      - name: Replay the exact consumer patches
        run: |
          python3 scripts/prepare-flutter-ci.py \
            --official-client-tree .build-deps/official-client \
            --output .build-deps/client/flutter --platform linux
      - name: Resolve only the changed consumer graph
        run: |
          set -euo pipefail
          dart --version 2>&1 | grep -F 'Dart SDK version: 3.5.4 '
          cd .build-deps/client/flutter
          flutter pub get
          dart format --output=none lib
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee client-analysis.log
      - name: Bind the resolved artifact to this source
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = ['native/frb/UPSTREAM.lock', 'scripts/prepare-flutter-ci.py',
                   'native/frb/patches/official-client-scope-pruning.patch',
                   '.build-deps/client/flutter/pubspec.yaml',
                   '.build-deps/client/flutter/pubspec.lock']
          receipt = {'engine_sha': os.environ['GITHUB_SHA'],
                     'sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                                for p in files if Path(p).is_file()}}
          Path('client-lock-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: client-lock-${{ github.sha }}
          path: |
            .build-deps/client/flutter/pubspec.lock
            .build-deps/client/flutter/client-analysis.log
            client-lock-source.json
          if-no-files-found: error
          retention-days: 7
