[package]
name = "rd_engine_native_har"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

# ArkTS-facing NAPI surface of rd-engine, packaged into the rustdesk-ohrs HAR.
# Session entry points are added here as they are wired to the engine; nothing
# answers with a fabricated value.

# Own workspace: this crate builds independently of the engine workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.0", default-features = false, features = ["napi8", "async"] }
napi-derive-ohos = { version = "1.0" }
rd-engine = { path = "../.." }
hbb_common = { path = "../../vendor/rustdesk/libs/hbb_common" }
base = { path = "../../vendor/rustdesk/libs/base" }
serde_json = "1.0"

[build-dependencies]
napi-build-ohos = { version = "1.0" }

# Same correction the engine used before the split: the vendored crate builds libsodium for
# aarch64-unknown-linux-ohos and carries the build-only ExFAT archive-lock correction.
[patch.crates-io]
libsodium-sys = { path = "../../vendor/libsodium-sys" }
# The root workspace patch is not inherited by this independent HAR workspace.
ironrdp-pdu = { path = "../../vendor/ironrdp-pdu" }
webrtc = { git = "https://github.com/rustdesk-org/webrtc", rev = "80d5a20532cf58f5d4d237c437a98ceb85ee40dc" }
webrtc-util = { git = "https://github.com/rustdesk-org/webrtc", rev = "80d5a20532cf58f5d4d237c437a98ceb85ee40dc" }
webrtc-sctp = { git = "https://github.com/rustdesk-org/webrtc", rev = "80d5a20532cf58f5d4d237c437a98ceb85ee40dc" }
